name: Siddhanta Daily Social Automator

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST (Post 1: Daily Panchang Anchor)
    - cron: '30 0 * * *'
    # 05:30 UTC = 11:00 AM IST (Post 2: Daily Thematic / Festival / Transit / Promo)
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Post slot to publish: primary (Panchang), secondary (Thematic), both, or auto'
        required: false
        type: choice
        options:
          - 'auto'
          - 'primary'
          - 'secondary'
          - 'both'
        default: 'auto'
      dry_run:
        description: 'Run in dry-run mode (do not post to Instagram)'
        required: false
        type: boolean
        default: false
      card_type:
        description: 'Force specific card type (leave empty for auto selection)'
        required: false
        type: choice
        options:
          - 'auto'
          - 'panchang'
          - 'plan_day'
          - 'festival'
          - 'kundli'
          - 'chakra'
          - 'jyotish'
        default: 'auto'
      target_date:
        description: 'Target date YYYY-MM-DD (leave empty for today)'
        required: false
        type: string
        default: ''
  repository_dispatch:
    types:
      - panchang-data-updated
      - panchang_updated
      - trigger_automation

permissions:
  contents: read

jobs:
  daily-blueprint-publisher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout promo-studio
        uses: actions/checkout@v4

      - name: Fetch Siddhanta Data from data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: tshashwat7/panchang
          ref: data
          token: ${{ secrets.PANCHANG_REPO_PAT || secrets.DATA_BRANCH_TOKEN || github.token }}
          path: data/panchang-data

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Social Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_HOST_KEY: ${{ secrets.IMAGE_HOST_KEY }}
          PANCHANG_REPO_PAT: ${{ secrets.PANCHANG_REPO_PAT }}
          DATA_BRANCH_TOKEN: ${{ secrets.DATA_BRANCH_TOKEN }}
        run: |
          CMD="python -m promo_studio.automation.daily_worker"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          if [ -n "${{ inputs.slot }}" ] && [ "${{ inputs.slot }}" != "auto" ]; then
            CMD="$CMD --slot ${{ inputs.slot }}"
          fi

          if [ -n "${{ inputs.card_type }}" ] && [ "${{ inputs.card_type }}" != "auto" ]; then
            CMD="$CMD --type ${{ inputs.card_type }}"
          fi

          if [ -n "${{ inputs.target_date }}" ]; then
            CMD="$CMD --date ${{ inputs.target_date }}"
          fi

          echo "Executing: $CMD"
          $CMD

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-post-output
          path: output/
          if-no-files-found: ignore
