name: Siddhanta Daily Social Automator

on:
  # schedule:
  #   # Paused: redundant with panchang-data-updated repository_dispatch
  #   # - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Post slot: auto (streamlined daily sequence), master (carousel only), festival, or reel'
        required: false
        type: choice
        options:
          - 'auto'
          - 'master'
          - 'festival'
          - 'reel'
          - 'carousel_only'
        default: 'auto'
      dry_run:
        description: 'Run in dry-run mode (do not post to Instagram)'
        required: false
        type: boolean
        default: false
      card_type:
        description: 'Force specific card type (leave empty for auto selection)'
        required: false
        type: choice
        options:
          - 'auto'
          - 'master'
          - 'panchang'
          - 'plan_day'
          - 'festival'
          - 'kundli'
          - 'chakra'
          - 'jyotish'
        default: 'auto'
      target_date:
        description: 'Target date YYYY-MM-DD (leave empty for today)'
        required: false
        type: string
        default: ''
      publish_reel:
        description: 'Generate and publish daily Reel MP4 only'
        required: false
        type: boolean
        default: false
      reel_lang:
        description: 'Reel language (en, hi, or both)'
        required: false
        type: choice
        options:
          - 'en'
          - 'hi'
          - 'both'
        default: 'en'
  repository_dispatch:
    types:
      - panchang-data-updated
      - panchang_updated
      - trigger_automation

permissions:
  contents: read

concurrency:
  group: daily-social-publisher
  cancel-in-progress: false

jobs:
  daily-blueprint-publisher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout promo-studio
        uses: actions/checkout@v4

      - name: Fetch Siddhanta Data from data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: tshashwat7/panchang
          ref: data
          token: ${{ secrets.PANCHANG_REPO_PAT || secrets.DATA_BRANCH_TOKEN || github.token }}
          path: data/panchang-data

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Daily Social Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_HOST_KEY: ${{ secrets.IMAGE_HOST_KEY }}
          PANCHANG_REPO_PAT: ${{ secrets.PANCHANG_REPO_PAT }}
          DATA_BRANCH_TOKEN: ${{ secrets.DATA_BRANCH_TOKEN }}
          REELS_MEDIA_PAT: ${{ secrets.REELS_MEDIA_PAT || secrets.PANCHANG_REPO_PAT }}
          REELS_MEDIA_REPO: tshashwat7/siddhanta-reels-media
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          APP_URL: ${{ secrets.APP_URL || 'https://bit.ly/47HN61M' }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://siddhanta.pages.dev' }}
        run: |
          CMD="python -m promo_studio.automation.daily_worker"

          if [ "${{ inputs.publish_reel }}" = "true" ]; then
            CMD="$CMD --reel --reel-lang ${{ inputs.reel_lang || 'en' }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          if [ -n "${{ inputs.slot }}" ] && [ "${{ inputs.slot }}" != "auto" ]; then
            CMD="$CMD --slot ${{ inputs.slot }}"
          fi

          if [ -n "${{ inputs.card_type }}" ] && [ "${{ inputs.card_type }}" != "auto" ]; then
            CMD="$CMD --type ${{ inputs.card_type }}"
          fi

          if [ -n "${{ inputs.target_date }}" ]; then
            CMD="$CMD --date ${{ inputs.target_date }}"
          fi

          echo "Executing: $CMD"
          $CMD

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-post-output
          path: output/
          if-no-files-found: ignore
