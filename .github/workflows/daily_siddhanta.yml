name: Siddhanta Daily Cosmic Blueprint Poster

on:
  schedule:
    # 00:30 UTC is exactly 06:00 AM Indian Standard Time (IST) every day
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate cards and copy without posting to Instagram)'
        type: boolean
        required: false
        default: false
      format:
        description: 'Post format'
        type: choice
        options:
          - carousel
          - single
        default: 'carousel'

jobs:
  daily-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Fonts (for Pillow card rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Cosmic Blueprint Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_HOST_KEY: ${{ secrets.IMAGE_HOST_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PYTHONPATH: .
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          FORMAT="${{ github.event.inputs.format || 'carousel' }}"
          python -m promo_studio.automation.daily_worker $FLAGS --format $FORMAT

      - name: Archive Today's Generated Cards (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cosmic-cards-${{ github.run_id }}
          path: output/
          retention-days: 7
