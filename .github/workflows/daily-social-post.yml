# GitHub Actions workflow for the Siddhanta Social Automator
# File: .github/workflows/daily-social-post.yml

name: Siddhanta Daily Social Media Poster

on:
  # Run daily at 5:15 AM IST (11:45 PM UTC previous day)
  # 15 minutes after Flutter data generation
  schedule:
    - cron: '45 23 * * *'

  # Triggered directly by the panchang repo when new data is pushed to data branch
  repository_dispatch:
    types: [panchang-data-updated]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate images & captions without publishing to Meta)'
        required: false
        type: boolean
        default: false
      card_type:
        description: 'Force specific card type (leave empty for intelligent auto-selection)'
        required: false
        type: choice
        options:
          - ''
          - panchang
          - plan_day
          - festival
          - kundli
          - chakra
          - jyotish

jobs:
  generate-and-post:
    name: Generate 1080x1350 Card & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout Automator Repo
      - name: Checkout Automator
        uses: actions/checkout@v4

      # 2. Checkout Panchang Data from the 'data' branch
      - name: Fetch Siddhanta Data from data branch
        uses: actions/checkout@v4
        with:
          repository: tshashwat7/panchang
          ref: data
          token: ${{ secrets.PANCHANG_REPO_PAT }}
          path: data/panchang-data

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 4. Install Dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || pip install pillow requests google-genai

      # 5. Run Daily Worker
      - name: Generate & Publish Daily Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_HOST_KEY: ${{ secrets.IMAGE_HOST_KEY }}
          PANCHANG_REPO_PAT: ${{ secrets.PANCHANG_REPO_PAT }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.card_type }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --type ${{ github.event.inputs.card_type }}"
          fi
          python -m promo_studio.automation.daily_worker $EXTRA_ARGS

      # 6. Upload Generated Cards & Captions as Workflow Artifact
      - name: Upload Daily Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siddhanta-daily-content
          path: output/
          retention-days: 7
